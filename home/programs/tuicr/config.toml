theme = "catppuccin-mocha"
diff_view = "unified"
ignore_whitespace = false
show_file_list = true
mouse = true
comment_vim = true # want my comment editing to be in vim mode
comment_tab_width = 4
wrap = true
cursor_line = true
transparent_background = true
scroll_offset = 5
no_update_check = false
review_watch_interval_ms = 1000
backend = "libgit2"
comment_types = [
  { id = "none", label = "normal" },                                                        # first entry is the default; "none" = untyped
  { id = "💡", label = "suggestion", definition = "possible improvements", color = "blue" },
  { id = "🔧", label = "nitpick", definition = "small optional tweaks", color = "#d19a66" },
  { id = "❓", label = "question", definition = "ask for clarification", color = "yellow" },
  { id = "⚠️", label = "issue", definition = "problems to fix", color = "red" },
  { id = "🙌", label = "praise", definition = "positive feedback", color = "green" },
]

[forge]
comment_type_prefix = true

# AI review order + overview for PRs, via Gemini on Vertex AI. The project is
# pinned (Sheer Health's Vertex project, same as ~/.pi) rather than read from
# the ADC quota project, which `gcloud auth application-default login` drops
# when gcloud has no default project.
[review_guide]
enabled = true
project = "optimum-nebula-375615"
model = "gemini-4-argon"
thinking = "low"
timeout_secs = 180
credentials_file = "~/.config/gcloud/application_default_credentials.json"
# Replaces tuicr's built-in ordering prompt; edit review_guide_prompt.md next
# to this file. Changing it invalidates cached guides.
system_prompt_file = "~/.config/tuicr/review_guide_prompt.md"
