theme = "catppuccin-mocha"
diff_view = "unified"
ignore_whitespace = false
show_file_list = true
mouse = true
comment_vim = true # want my comment editing to be in vim mode
comment_tab_width = 4
wrap = true
cursor_line = true
transparent_background = true
scroll_offset = 5
no_update_check = false
review_watch_interval_ms = 1000
backend = "libgit2"
comment_types = [
  { id = "none", label = "normal" },                                                        # first entry is the default; "none" = untyped
  { id = "💡", label = "suggestion", definition = "possible improvements", color = "blue" },
  { id = "🔧", label = "nitpick", definition = "small optional tweaks", color = "#d19a66" },
  { id = "❓", label = "question", definition = "ask for clarification", color = "yellow" },
  { id = "⚠️", label = "issue", definition = "problems to fix", color = "red" },
  { id = "🙌", label = "praise", definition = "positive feedback", color = "green" },
]

[forge]
comment_type_prefix = true

# AI review order + overview for PRs. tuicr pipes a JSON request (instructions,
# PR metadata, patches) to this command and reads a JSON guide from its stdout.
# The flags after --effort keep `claude -p` lean: no tools, no MCP servers, no
# saved session, and a one-line system prompt instead of the coding-agent one.
[review_guide]
command = [
  "claude",
  "-p",
  "--model",
  "claude-opus-5-5",
  "--effort",
  "low",
  "--system-prompt",
  "You plan code reviews. The user message is a JSON request. Follow its `instructions` and answer with JSON only.",
  "--tools",
  "",
  "--strict-mcp-config",
  "--no-session-persistence",
  "--disable-slash-commands",
]
timeout_secs = 120
# Ordering and style rules; tuicr appends the response format itself.
# Changing the prompt or the command invalidates cached guides.
prompt_file = "~/.config/tuicr/review_guide_prompt.md"
